<title>新澳门 · 六合分析</title>
<style>
:root{--bg:#0F1115;--card:#171A21;--card2:#1E222B;--txt:#E6E8EE;--sub:#8B93A5;--acc:#4F8CFF;--ok:#2ECC71;--warn:#F5A623;--bad:#FF5C5C;--gold:#FFD700;--purple:#8E7CFF;--teal:#17BEBB;--red:#D9363E;--blue:#2E6BD9;--green:#2E9E5B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Heiti SC",sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top)}
#app{padding:12px 14px calc(30px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:0}
.nav{display:flex;gap:3px;align-items:stretch}
.nav button{flex:1 1 0;min-width:0;border-radius:8px;padding:7px 1px;font-size:10px;color:#fff;line-height:1.25;overflow:hidden;white-space:nowrap}
.nav button.on{outline:2px solid rgba(255,255,255,.55);outline-offset:-2px}
.status{color:var(--sub);font-size:11px;margin-top:7px;padding-left:2px;line-height:1.45}
.card{background:var(--card);border-radius:12px;padding:14px;margin-top:12px}
.sec{font-size:15px;font-weight:700}
/* 推荐历史：折叠头（标题 + 展开按钮，紧凑单行） */
.histhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sechint{font-size:11px;font-weight:400;color:var(--sub);margin-left:6px}
.hbtn{flex:0 0 auto;border-radius:7px;padding:5px 11px;font-size:11px;color:#fff;line-height:1.2;white-space:nowrap;transition:background .15s}
/* 推荐两栏（平码 / 特码）：左侧色条分栏 + 来源小标签 */
.zcol{border-left:3px solid var(--card2);border-radius:6px;padding:1px 0 3px 9px;margin-top:10px}
.zcolt{font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:2px}
.tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;background:var(--card2);color:var(--sub);font-size:9px;font-weight:400;vertical-align:middle;letter-spacing:0}
/* 特码推荐号码图（18码中特图） */
.zsub{font-size:12px;font-weight:700;color:var(--gold);margin-top:11px;padding-top:9px;border-top:1px solid var(--card2)}
.picwrap{margin-top:5px}
.picerr{color:var(--bad);font-size:11px;line-height:1.5;padding:8px 0}
/* v2.7 爆冷保留：极冷=金 冷=琥珀 */
.tip{color:var(--sub);font-size:11px;margin-top:3px;line-height:1.45}
.ln{margin-top:3px;font-size:13px;line-height:1.5}
.ballrow{display:flex;align-items:flex-start;overflow-x:auto;margin-top:8px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.ballcol{flex:0 0 42px;width:42px;display:flex;flex-direction:column;align-items:center;margin-right:4px}
.ball{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;background:var(--card2);flex:0 0 auto}
.ztag{font-size:9px;color:var(--sub);line-height:1.15;margin-top:1px;text-align:center}
.ctag{font-size:9px;line-height:1.15;margin-top:1px;text-align:center}
.plus{color:var(--gold);font-size:18px;padding:8px 2px 0;align-self:flex-start;flex:0 0 auto}
.hrow{display:flex;align-items:center;margin-top:5px;font-size:13px}
.hrow .k{flex:0 0 auto}
.hrow .v{color:var(--sub);font-size:12px;min-width:34px;text-align:right}
.hrow .t{flex:0 0 auto;font-size:11px;color:var(--sub);margin-right:6px;white-space:nowrap}
.barwrap{flex:1 1 auto;min-width:0;display:flex;align-items:center;overflow:hidden}
.bar{border-radius:4px;background:var(--acc);min-width:2px}
.grid7{display:flex;margin-top:6px}
.cell{flex:1 1 0;min-width:0;border:2px solid var(--card2);border-radius:8px;padding:4px 0 5px;margin-right:4px;text-align:center;background:var(--card2)}
.cell:last-child{margin-right:0}
.cell .n{font-size:16px;font-weight:700;line-height:1.15}
.cell .z{font-size:9px;line-height:1.15}
.cell .o{font-size:10px;color:var(--sub);line-height:1.3}
.cell.empty{background:transparent;border-color:transparent}
.chip{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--card2);border-radius:8px;padding:5px 8px;margin:6px 6px 0 0;font-size:13px;line-height:1.3;text-align:center;white-space:pre-line}
.chiprow{display:flex;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;align-items:center;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin:0 5px 0 0}
.legend span{font-size:10px;color:var(--sub);margin-right:12px;display:inline-flex;align-items:center}
.track{position:relative;height:11px;border-radius:4px;background:var(--card2);flex:1 1 auto;min-width:0;margin-right:6px}
.track>i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;display:block}
.foot{color:var(--sub);font-size:10px;text-align:center;margin-top:16px;line-height:1.5}
.statrow{display:flex}
.statchip{flex:1 1 0;border:2px solid var(--card2);border-radius:10px;padding:10px;text-align:center;margin-right:6px}
.statchip:last-child{margin-right:0}
.statchip b{display:block;font-size:22px;line-height:1.2}
.statchip span{color:var(--sub);font-size:11px}
canvas{width:100%;display:block}
.overlay{position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center;overflow:auto}
.overlay img{max-width:100%;height:auto}
.overlay .close{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:14px;background:rgba(255,255,255,.16);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px}
.pager{display:flex;align-items:center;margin-top:10px}
.pager .mid{flex:1 1 auto;text-align:center;color:var(--sub);font-size:12px}
.mini{flex:1 1 0;min-width:0;border-radius:8px;padding:7px 2px;font-size:11px;color:#fff;background:var(--card2);margin-right:3px}
.mini:last-child{margin-right:0}
.rankrow{display:flex;align-items:center;margin-top:5px;font-size:13px}

.rankrow .n{flex:0 0 52px;text-align:right;font-size:12px;margin-right:6px}
img.pic{display:block;width:100%;border-radius:8px;background:var(--card2)}

var LS=(function(){
  var mem={},ok=false;
  try{localStorage.setItem('xam_probe','1');localStorage.removeItem('xam_probe');ok=true;}catch(e){ok=false;}
  return {ok:ok,
    get:function(k,d){
      if(ok){try{var v=localStorage.getItem(k);if(v!=null)return v;}catch(e){ok=false;}}
      return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:d;},
    set:function(k,v){
      mem[k]=v;
      if(ok){try{localStorage.setItem(k,v);}catch(e){ok=false;}}}
  };
})();
function bootDraws(){
  var out=[];
  try{
    var recs=String(BOOT_DATA||'').split(';');
    var W={r:'red',g:'green',b:'blue'};
    for(var i=0;i<recs.length;i++){
      var f=String(recs[i]).split('|');
      if(f.length<5||!f[0])continue;
      var d={issue:f[0],time:f[1]||'',wave:'',nums:[0,0,0,0,0,0,0],zodiac:['','','','','','','']};
      var wl=String(f[2]||'').split(''),ws=[];
      for(var j=0;j<wl.length;j++)ws.push(W[wl[j]]||'');
      d.wave=ws.join(',');
      var cs=String(f[3]||'').split(',');
      for(var k=0;k<7&&k<cs.length;k++){var v=parseInt(cs[k],10);d.nums[k]=isNaN(v)?0:v;}
      var zs=String(f[4]||'').split(',');
      for(var k2=0;k2<7&&k2<zs.length;k2++)d.zodiac[k2]=simpZodiac(zs[k2]);
      out.push(d);
    }
  }catch(e){}
  return out;
}

/* ---------- HTTP（超时 + 错误归一） ---------- */
function httpGetRaw(url,ms){
  ms=ms||20000;
  if(typeof fetch!=='function')return Promise.resolve('HTTP 环境不支持 fetch');
  var ctl=null,opt={method:'GET',headers:{'Accept':'application/json'},cache:'no-store'};
  try{ctl=new AbortController();opt.signal=ctl.signal;}catch(e){}
  var t=setTimeout(function(){try{ctl&&ctl.abort();}catch(e){}},ms);
  return fetch(url,opt).then(function(r){
    clearTimeout(t);
    if(!r.ok)return 'HTTP '+r.status;
    return r.text();
  }).catch(function(e){clearTimeout(t);return 'HTTP '+(e&&e.message?e.message:String(e));});
}
function httpPostJson(url,body,ms){
  ms=ms||20000;
  var ctl=null,opt={method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:body,cache:'no-store'};
  try{ctl=new AbortController();opt.signal=ctl.signal;}catch(e){}
  var t=setTimeout(function(){try{ctl&&ctl.abort();}catch(e){}},ms);
  return fetch(url,opt).then(function(r){
    clearTimeout(t);
    if(!r.ok)return 'HTTP '+r.status;
    return r.text();
  }).catch(function(e){clearTimeout(t);return 'HTTP '+(e&&e.message?e.message:String(e));});
}
function isErr(r){return r==null||String(r).slice(0,4)==='HTTP';}

/* ============================================================
   数据层 LottoStore
   ============================================================ */
function Store(){
  this.draws=[];this.prediction=null;this.recoHistory=[];
  this.load();this.loadReco();
}
Store.prototype.save=function(){
  try{
    var arr=this.draws.map(function(d){
      return {issue:d.issue,time:d.time,wave:d.wave,nums:d.nums.join(','),zodiac:d.zodiac.join(',')};});
    LS.set('xam_draws',JSON.stringify(arr));
  }catch(e){}
};
Store.prototype.load=function(){
  try{
    var s=LS.get('xam_draws','');
    if(s){
      var arr=JSON.parse(s);this.draws=[];
      for(var i=0;i<arr.length;i++){
        var o=arr[i],d={issue:o.issue||'',time:o.time||'',wave:o.wave||'',nums:[0,0,0,0,0,0,0],zodiac:['','','','','','','']};
        var nb=String(o.nums||'').split(',');
        for(var k=0;k<7&&k<nb.length;k++){var v=parseInt(nb[k],10);d.nums[k]=isNaN(v)?0:v;}
        var zb=String(o.zodiac||'').split(',');
        for(var k2=0;k2<7&&k2<zb.length;k2++)d.zodiac[k2]=zb[k2];
        this.draws.push(d);
      }
      this.sortDesc();this.trim();
    }
  }catch(e){}
  /* 本地存档为空（首次打开 / file:// 下存储被禁）→ 用内嵌的 150 期兜底，
     保证「打开即有完整内容」，离线也能算冷门、杀生肖、推荐、走势 */
  if(!this.draws.length){
    var bd=bootDraws();
    if(bd.length){this.draws=bd;this.sortDesc();this.trim();this.booted=true;}
  }
};
/* 内嵌数据是否已生效（用于状态栏提示） */
Store.prototype.usingBoot=function(){return this.booted===true&&this.draws.length>0;};
Store.prototype.sortDesc=function(){
  this.draws.sort(function(a,b){return a.issue<b.issue?1:(a.issue>b.issue?-1:0);});
};
Store.prototype.trim=function(){while(this.draws.length>MAX_KEEP)this.draws.pop();};
Store.prototype.merge=function(d){
  if(!d||!d.issue)return;
  for(var i=0;i<this.draws.length;i++){
    if(this.draws[i].issue===d.issue){this.draws[i]=d;return;}
  }
  this.draws.push(d);this.sortDesc();this.trim();
};
Store.prototype.toDraw=function(o){
  var d={issue:o.expect||'',time:o.openTime||'',wave:o.wave||'',nums:[0,0,0,0,0,0,0],zodiac:['','','','','','','']};
  var cs=String(o.openCode||'').split(','),zs=String(o.zodiac||'').split(',');
  var n=Math.min(7,cs.length);
  for(var i=0;i<7;i++){
    if(i<n){var v=parseInt(String(cs[i]).trim(),10);d.nums[i]=isNaN(v)?0:v;}
    d.zodiac[i]=zs.length>i?simpZodiac(zs[i]):'';
  }
  return d;
};
/* live 抓最新一期：多端点回退 */
Store.prototype.fetchLatest=function(){
  var self=this,lastErr='无网络';
  var i=0;
  function step(){
    if(i>=APIS.length)return Promise.resolve(lastErr);
    var api=APIS[i++];
    return httpGetRaw(api).then(function(body){
      if(isErr(body)){lastErr=body;return step();}
      if(body==null){lastErr='空响应';return step();}
      var r=self.parseArray(body,true);
      if(r==null)return null;
      lastErr=r;return step();
    });
  }
  return step();
};
Store.prototype.parseArray=function(json,mergeIt){
  try{
    var arr=JSON.parse(String(json).trim());
    if(!arr.length)return '空数据';
    var d=this.toDraw(arr[0]);
    if(mergeIt){this.merge(d);this.save();}
    return null;
  }catch(e){return '解析失败：'+(e&&e.message?e.message:e);}
};
/* 历史批量：按年接口，30 年步长翻页，凑够 MAX_KEEP
   注意：首次必须请求【当前年】（对齐 Android for 循环语义：循环体先跑、year 才 -=30）
   force=true：即使本地已满 150 期也强制拉一次【当前年】整年，
   用于「内嵌快照已过期、联网后补齐到今天」的场景，避免中间出现期号缺口。 */
Store.prototype.fetchHistory=function(force){
  var self=this,before=this.draws.length,year=(new Date()).getFullYear(),lastErr='无历史',k=0;
  function step(){
    if(k>=12||(force?k>=1:self.draws.length>=MAX_KEEP)){
      if(self.draws.length>=MAX_KEEP||self.draws.length>before)return Promise.resolve(null);
      return Promise.resolve(lastErr);
    }
    k++;
    var y=year;year-=30;
    return httpGetRaw(HIST_PREFIX+y,30000).then(function(body){
      if(isErr(body)){lastErr='年份'+y+'获取失败';return step();}
      var n=self.parseHistory(body);
      if(n===0)lastErr='年份'+y+'无数据';
      self.save();
      return step();
    });
  }
  return step();
};
Store.prototype.parseHistory=function(json){
  var n=0;
  try{
    var root=JSON.parse(String(json).trim()),arr=root.data;
    if(!arr)return 0;
    for(var i=0;i<arr.length;i++){
      var d=this.toDraw(arr[i]);
      if(d.issue.length>0){this.merge(d);n++;}
    }
    this.sortDesc();this.trim();
  }catch(e){}
  return n;
};
/* ---------- 在线预测（杀生肖/精选码） ---------- */
Store.prototype.fetchPrediction=function(){
  var self=this;
  return httpGetRaw(PRED_API).then(function(body){
    if(isErr(body))return;
    try{
      var root=JSON.parse(String(body).trim());
      var data=root.data;if(!data)return;
      var content=data.content;if(!content)return;
      var guesses=content.guess;if(!guesses)return;
      var p={issue:'',zodiac6:[],zodiac8:[],codes1:[],codes5:[],codes10:[]};
      for(var i=0;i<guesses.length;i++){
        var g=guesses[i];
        var result=(g.result==null?-1:g.result);
        if(result!==0)continue;                 /* 只取当期未开奖的预测 */
        var issue=g.issue||'';
        if(!p.issue.length)p.issue=issue;
        if(issue!==p.issue)continue;
        var type=String(g.type||''),ctx=g.context;
        if(!ctx)continue;
        if(type==='8')for(var j=0;j<ctx.length;j++)p.zodiac6.push(ctx[j]);
        else if(type==='10')for(var j2=0;j2<ctx.length;j2++)p.zodiac8.push(ctx[j2]);
        else if(type==='24')for(var j3=0;j3<ctx.length;j3++)p.codes1.push(parseInt(ctx[j3],10));
        else if(type==='28')for(var j4=0;j4<ctx.length;j4++)p.codes5.push(parseInt(ctx[j4],10));
        else if(type==='33')for(var j5=0;j5<ctx.length;j5++)p.codes10.push(parseInt(ctx[j5],10));
      }
      if(p.issue.length)self.prediction=p;
    }catch(e){}
  });
};
Store.prototype.onlineKillZodiacs=function(){
  var out=[];
  if(!this.prediction||!this.prediction.zodiac8.length)return out;
  var z8=this.prediction.zodiac8;
  for(var i=0;i<ZODIAC.length;i++)if(z8.indexOf(ZODIAC[i])<0)out.push(ZODIAC[i]);
  return out;
};
Store.prototype.onlineRecommendZodiacs=function(){
  if(!this.prediction||!this.prediction.zodiac6.length)return [];
  return this.prediction.zodiac6.slice();
};
/* ---------- 冷门（数据驱动，只看特码） ---------- */
Store.prototype.coldLevel=function(omission){
  if(omission>=COLD_T2)return 2;if(omission>=COLD_T1)return 1;return 0;
};
Store.prototype.coldLevelOf=function(num){
  if(num<1||num>49)return 0;return this.coldLevel(this.omission(num));
};
Store.prototype.lastSeenIndex=function(num){
  for(var i=0;i<this.draws.length;i++)if(this.draws[i].nums[6]===num)return i;
  return -1;
};
Store.prototype.omission=function(num){
  var idx=this.lastSeenIndex(num);
  return idx<0?this.draws.length:idx;
};
Store.prototype.allOmissions=function(){
  var o=new Array(50);
  for(var n=1;n<=49;n++)o[n]=this.omission(n);
  return o;
};
Store.prototype.coldCounts=function(){
  var c=[0,0];
  for(var n=1;n<=49;n++){
    var lv=this.coldLevel(this.omission(n));
    if(lv===1)c[0]++;else if(lv===2)c[1]++;
  }
  return c;
};
/* 第 drawIndex 期特码“开出前”的遗漏期数 */
Store.prototype.omissionBefore=function(drawIndex){
  var n=this.draws.length;
  if(drawIndex<0||drawIndex>=n)return 0;
  var v=this.draws[drawIndex].nums[6];
  if(v<1||v>49)return 0;
  for(var j=drawIndex+1;j<n;j++)if(this.draws[j].nums[6]===v)return j-drawIndex-1;
  return n-1-drawIndex;
};
/* 每期特码“开出前”冷度等级（下标=期序，0=最新），单次倒序扫描 O(N) —— v2.7 爆冷标记永久保留 */
Store.prototype.coldLevelsBefore=function(){
  var n=this.draws.length,lv=new Array(n),last=new Array(50);
  for(var v=0;v<50;v++)last[v]=-1;
  for(var i=n-1;i>=0;i--){
    var x=this.draws[i].nums[6];
    lv[i]=0;
    if(x>=1&&x<=49){
      lv[i]=this.coldLevel(last[x]>=0?last[x]-i-1:n-1-i);
      last[x]=i;
    }
  }
  return lv;
};
/* ---------- 频率 / 间隔 ---------- */
Store.prototype.freqFlat=function(num){
  var c=0;
  for(var i=0;i<this.draws.length;i++)for(var k=0;k<6;k++)if(this.draws[i].nums[k]===num)c++;
  return c;
};
Store.prototype.freqSpecial=function(num){
  var c=0;
  for(var i=0;i<this.draws.length;i++)if(this.draws[i].nums[6]===num)c++;
  return c;
};
Store.prototype.weightedFreqFlat=function(num){
  var c=0,lim=Math.min(WINDOW,this.draws.length);
  for(var i=0;i<lim;i++){var d=this.draws[i];for(var k=0;k<6;k++)if(d.nums[k]===num)c+=WINDOW-i;}
  return c;
};
Store.prototype.weightedFreqSpecial=function(num){
  var c=0,lim=Math.min(WINDOW,this.draws.length);
  for(var i=0;i<lim;i++)if(this.draws[i].nums[6]===num)c+=WINDOW-i;
  return c;
};
Store.prototype.gapHistogram=function(){
  var hist=new Array(600),last=new Array(50);
  for(var q=0;q<600;q++)hist[q]=0;
  for(var v=0;v<50;v++)last[v]=0;
  for(var i=0;i<this.draws.length;i++){
    var x=this.draws[i].nums[6];
    if(x>=1&&x<=49){
      if(last[x]>0){var g=i-last[x];if(g>=0&&g<hist.length)hist[g]++;}
      last[x]=i+1;
    }
  }
  return hist;
};
Store.prototype.maxGap=function(){
  var h=this.gapHistogram();
  for(var g=h.length-1;g>=0;g--)if(h[g]>0)return g;
  return 0;
};
Store.prototype.hitsOf=function(num){
  var c=0;
  for(var i=0;i<this.draws.length;i++)if(this.draws[i].nums[6]===num)c++;
  return c;
};
Store.prototype.maxGapOf=function(num){
  var max=0,last=-1;
  for(var i=0;i<this.draws.length;i++){
    if(this.draws[i].nums[6]===num){if(last>=0){var g=i-last-1;if(g>max)max=g;}last=i;}
  }
  return max;
};
Store.prototype.avgGapOf=function(num){
  var h=this.hitsOf(num);
  if(h<=0)return this.draws.length;
  return this.draws.length/h;
};
/* ---------- 生肖统计 ---------- */
function zmap(){var m={};for(var i=0;i<ZODIAC.length;i++)m[ZODIAC[i]]=0;return m;}
Store.prototype.zodiacCount=function(includeSpecial){
  var m=zmap();
  for(var i=0;i<this.draws.length;i++){
    var d=this.draws[i],lim=includeSpecial?7:6;
    for(var k=0;k<lim;k++){
      var z=d.zodiac[k];if(!z)continue;
      m[z]=(m[z]||0)+1;
    }
  }
  return m;
};
Store.prototype.zodiacCountFlat=function(){
  var m=zmap();
  for(var i=0;i<this.draws.length;i++){var d=this.draws[i];
    for(var k=0;k<6;k++){var z=d.zodiac[k];if(!z)continue;m[z]=(m[z]||0)+1;}}
  return m;
};
Store.prototype.zodiacCountSpecial=function(){
  var m=zmap();
  for(var i=0;i<this.draws.length;i++){var z=this.draws[i].zodiac[6];if(!z)continue;m[z]=(m[z]||0)+1;}
  return m;
};
Store.prototype.zodiacLastIndexFlat=function(){
  var m={},total=this.draws.length;
  for(var i=0;i<ZODIAC.length;i++)m[ZODIAC[i]]=total;
  for(var j=0;j<this.draws.length;j++){var d=this.draws[j];
    for(var k=0;k<6;k++){var z=d.zodiac[k];if(z==null)continue;if(m[z]===total)m[z]=j;}}
  return m;
};
Store.prototype.zodiacLastIndexSpecial=function(){
  var m={},total=this.draws.length;
  for(var i=0;i<ZODIAC.length;i++)m[ZODIAC[i]]=total;
  for(var j=0;j<this.draws.length;j++){var z=this.draws[j].zodiac[6];
    if(z==null)continue;if(m[z]===total)m[z]=j;}
  return m;
};
/* 回看区间 0..hi（含）内每个生肖最近一次出现的下标；未出现 = hi+1 */
Store.prototype.zodiacLastIndexRange=function(hi,special){
  var m={},lim=Math.min(hi+1,this.draws.length);
  for(var i=0;i<ZODIAC.length;i++)m[ZODIAC[i]]=hi+1;
  for(var j=0;j<lim;j++){
    var d=this.draws[j],ks=special?[6]:[0,1,2,3,4,5];
    for(var t=0;t<ks.length;t++){var z=d.zodiac[ks[t]];if(z==null)continue;if(m[z]===hi+1)m[z]=j;}
  }
  return m;
};
/* 近窗加权生肖计数：第 i 期（从新到旧）每个命中生肖加 (WINDOW - i) */
Store.prototype.zodiacWeightedCount=function(special){
  var m=zmap(),lim=Math.min(WINDOW,this.draws.length);
  for(var i=0;i<lim;i++){
    var d=this.draws[i],kStart=special?6:0,kEnd=special?7:6;
    for(var k=kStart;k<kEnd;k++){
      var z=d.zodiac[k];if(!z)continue;
      m[z]=(m[z]||0)+(WINDOW-i);
    }
  }
  return m;
};
/* 杀生肖排序键：[近窗加权计数降序, 全量最近出现下标升序]，取前 3 */
Store.prototype.killZodiacs=function(special){
  var zc=this.zodiacWeightedCount(special);
  var last=special?this.zodiacLastIndexSpecial():this.zodiacLastIndexFlat();
  var total=this.draws.length,list=ZODIAC.slice();
  list.sort(function(a,b){
    var va=zc[a]||0,vb=zc[b]||0;
    if(vb!==va)return vb-va;
    var oa=(last[a]==null?total:last[a]),ob=(last[b]==null?total:last[b]);
    return oa-ob;
  });
  return list.slice(0,3);
};
Store.prototype.keepZodiacs=function(special){
  var kill=this.killZodiacs(special),out=[];
  for(var i=0;i<ZODIAC.length;i++)if(kill.indexOf(ZODIAC[i])<0)out.push(ZODIAC[i]);
  return out;
};
/* ---------- 号码 ↔ 生肖 ---------- */
Store.prototype.numberZodiac=function(){
  var m={};
  for(var i=0;i<this.draws.length;i++){
    var d=this.draws[i];
    for(var k=0;k<7;k++){
      var num=d.nums[k],z=d.zodiac[k];
      if(num>=1&&num<=49&&z&&z.length>0&&m[num]==null)m[num]=z;
    }
  }
  return m;
};
Store.prototype.zodiacNumbers=function(){
  var m={};
  for(var i=0;i<ZODIAC.length;i++)m[ZODIAC[i]]=[];
  var nz=this.numberZodiac();
  for(var n=1;n<=49;n++){var z=nz[n];if(z&&m[z])m[z].push(n);}
  return m;
};
/* ---------- 推荐 ---------- */
Store.prototype.recommendFlat=function(groups){
  var kill=this.killZodiacs(false);
  var nz=this.numberZodiac(),pool=[];
  for(var n=1;n<=49;n++){var z=nz[n];if(!z)continue;if(kill.indexOf(z)>=0)continue;pool.push(n);}
  if(!pool.length)for(var n2=1;n2<=49;n2++)pool.push(n2);
  if(this.draws.length){
    var latest=this.draws[0];
    for(var k=0;k<7;k++){var i=pool.indexOf(latest.nums[k]);if(i>=0)pool.splice(i,1);}
    if(!pool.length)for(var n3=1;n3<=49;n3++)pool.push(n3);
  }
  var self=this;
  pool.sort(function(a,b){
    var fa=self.weightedFreqFlat(a),fb=self.weightedFreqFlat(b);
    if(fb!==fa)return fb-fa;
    return self.omission(a)-self.omission(b);
  });
  var out=[],idx=0;
  for(var g=0;g<groups;g++){
    var arr=[];
    for(var i2=0;i2<6;i2++){arr.push(pool[idx%pool.length]);idx++;}
    out.push(arr);
  }
  return out;
};
Store.prototype.recommendSpecial=function(count){
  var kill=this.killZodiacs(true);
  var nz=this.numberZodiac(),pool=[];
  for(var n=1;n<=49;n++){var z=nz[n];if(!z)continue;if(kill.indexOf(z)>=0)continue;pool.push(n);}
  if(!pool.length)for(var n2=1;n2<=49;n2++)pool.push(n2);
  if(this.draws.length){
    var latest=this.draws[0];
    for(var k=0;k<7;k++){var i=pool.indexOf(latest.nums[k]);if(i>=0)pool.splice(i,1);}
    if(!pool.length)for(var n3=1;n3<=49;n3++)pool.push(n3);
  }
  var self=this;
  pool.sort(function(a,b){
    var fa=self.weightedFreqSpecial(a),fb=self.weightedFreqSpecial(b);
    if(fb!==fa)return fb-fa;
    return self.omission(a)-self.omission(b);
  });
  return pool.slice(0,count);
};
/* ---------- 推荐历史（v3.0 命中追踪） ---------- */
Store.prototype.nextIssueOf=function(issue){
  try{
    if(!issue||issue.length!==7)return '';
    var y=issue.slice(0,4),n=parseInt(issue.slice(4),10);
    if(isNaN(n))return '';
    n++;
    if(n>365){n=1;y=String(parseInt(y,10)+1);}
    return y+(n<10?'00'+n:(n<100?'0'+n:''+n));
  }catch(e){return '';}
};
Store.prototype.saveReco=function(){
  try{
    var arr=this.recoHistory.map(function(h){
      return {issue:h.issue,ts:h.ts,flats:h.flats,specials:h.specials,
        flatHit:h.flatHit,specialHit:h.specialHit,specialHitNum:h.specialHitNum,judged:h.judged,
        onlineZ:h.onlineZ||[],flatZ:h.flatZ||[],specZ:h.specZ||[],
        onlineCodes:h.onlineCodes||[],onlineZHit:h.onlineZHit||0,
        flatZHit:h.flatZHit||0,onlineSpHit:h.onlineSpHit||0,specialReal:h.specialReal||0};});
    LS.set('xam_reco',JSON.stringify(arr));
  }catch(e){}
};
Store.prototype.loadReco=function(){

    var s=LS.get('xam_reco','');if(!s)return;
    var arr=JSON.parse(s);
    for(var i=0;i<arr.length;i++){
      var o=arr[i];
      if(!o.issue)continue;
      this.recoHistory.push({issue:o.issue,ts:o.ts||0,
        flats:o.flats||[],specials:o.specials||[],flatHit:o.flatHit||[],
        specialHit:o.specialHit||0,specialHitNum:o.specialHitNum||0,judged:o.judged||0,
        onlineZ:o.onlineZ||[],flatZ:o.flatZ||[],specZ:o.specZ||[],onlineCodes:o.onlineCodes||[],
        onlineZHit:o.onlineZHit||0,flatZHit:o.flatZHit||0,onlineSpHit:o.onlineSpHit||0,
        specialReal:o.specialReal||0});
    }
  }catch(e){}
};
Store.prototype.saveRecoSnapshot=function(issue,flats,specials,extra){
  if(!issue||!flats||!specials)return;
  extra=extra||{};
  var zone=function(a){return (a&&a.length)?a.slice():[];};
  try{
    var found=false;
    for(var i=0;i<this.recoHistory.length;i++){
      var h=this.recoHistory[i];
      if(h.issue!==issue)continue;
      if(h.judged===0){                 /* 未判定的可被覆盖刷新 */
        h.ts=Date.now();h.flats=flats.slice();h.specials=specials.slice();
        h.flatHit=new Array(flats.length);for(var q=0;q<h.flatHit.length;q++)h.flatHit[q]=0;
        h.specialHit=0;h.specialHitNum=0;
        h.onlineZ=zone(extra.onlineZ);h.flatZ=zone(extra.flatZ);h.specZ=zone(extra.specZ);
        h.onlineCodes=zone(extra.onlineCodes);
        h.onlineZHit=0;h.flatZHit=0;h.onlineSpHit=0;h.specialReal=0;
      }
      found=true;
    }
    if(!found){
      var nh={issue:issue,ts:Date.now(),flats:flats.slice(),specials:specials.slice(),
        flatHit:new Array(flats.length),specialHit:0,specialHitNum:0,judged:0,
        onlineZ:zone(extra.onlineZ),flatZ:zone(extra.flatZ),specZ:zone(extra.specZ),
        onlineCodes:zone(extra.onlineCodes),onlineZHit:0,flatZHit:0,onlineSpHit:0,specialReal:0};
      for(var q2=0;q2<nh.flatHit.length;q2++)nh.flatHit[q2]=0;
      this.recoHistory.unshift(nh);
    }
    while(this.recoHistory.length>RECO_KEEP)this.recoHistory.pop();
    this.saveReco();
  }catch(e){}
};
Store.prototype.judgeRecoHistory=function(){
  try{
    var changed=false;
    for(var i=0;i<this.recoHistory.length;i++){
      var h=this.recoHistory[i];
      if(h.judged!==0)continue;
      var d=null;
      for(var j=0;j<this.draws.length;j++){
        if(this.draws[j].issue===h.issue){d=this.draws[j];break;}
      }
      if(!d)continue;
      /* 平码：开奖前 6 个号 */
      if(h.flatHit.length!==h.flats.length)h.flatHit=new Array(h.flats.length);
      for(var k=0;k<h.flats.length;k++){
        var hit=0;
        for(var b=0;b<6;b++)if(h.flats[k]===d.nums[b]){hit=1;break;}
        h.flatHit[k]=hit;
      }
      /* 特码 */
      h.specialHit=0;h.specialHitNum=0;
      for(var k2=0;k2<h.specials.length;k2++){
        if(h.specials[k2]===d.nums[6]){h.specialHit=1;h.specialHitNum=d.nums[6];break;}
      }
      h.specialReal=d.nums[6]||0;
      /* 生肖命中：按平码 6 个生肖 / 特码生肖 分别判定（去重生肖） */
      var flatZSet={},specialZ=d.zodiac[6]||'';
      for(var b2=0;b2<6;b2++){var fz=d.zodiac[b2];if(fz)flatZSet[fz]=1;}
      var zhF=function(arr){
        var out=[];
        if(!arr)return out;
        for(var t=0;t<arr.length;t++)out.push(flatZSet[arr[t]]?1:0);
        return out;
      };
      var zhS=function(arr){
        var out=[];
        if(!arr)return out;
        for(var t3=0;t3<arr.length;t3++)out.push((arr[t3]&&arr[t3]===specialZ)?1:0);
        return out;
      };
      h.flatZHit=zhF(h.flatZ);
      h.specZHit=zhS(h.specZ);
      h.onlineZHit=zhS(h.onlineZ);
      var oh=[];
      for(var t2=0;t2<(h.onlineCodes||[]).length;t2++)oh.push(h.onlineCodes[t2]===d.nums[6]?1:0);
      h.onlineSpHit=oh;
      h.judged=1;changed=true;
    }
    if(changed)this.saveReco();
  }catch(e){}
};
/* ---------- 报警阈值（保留能力） ---------- */
Store.prototype.parseThresholds=function(s){
  var p=String(s||'').split(','),out=[];
  for(var i=0;i<p.length;i++){var v=parseInt(p[i].trim(),10);if(!isNaN(v)&&v>0)out.push(v);}
  return out;
};
Store.prototype.checkAlerts=function(){
  var out=[],o=this.allOmissions(),th=this.parseThresholds(LS.get('xam_alerts','15,30'));
  for(var n=1;n<=49;n++)for(var i=0;i<th.length;i++){
    if(o[n]===th[i])out.push('【'+pad(n)+(zodiacOfNum(n)?'·'+zodiacOfNum(n):'')+'】遗漏已达 '+th[i]+' 期');
  }
  return out;
};

var store=new Store();
/* ---------- 特码推荐号码图（18码中特图，来源：六合论坛） ----------
   数据源 /api/six-pictures?title=18码中特图（type=21 澳门），alias=18ma；
   图片 CDN 形如 https://amo.jlidesign.com:4949/col/<期>/18ma.jpg。
   缓存 10 分钟，接口取「期号最大」的一张；接口不通时按图源目录规则直拼兜底。 */

function loadPic18(force){
  /* 进行中则复用同一 Promise，避免并发调用拿到假的 false（启动预热与刷新撞车时常见） */
  if(pic18.loading)return pic18.pending||Promise.resolve(false);
  if(!force&&pic18.url&&Date.now()-pic18.ts<PIC18_FRESH_MS)return Promise.resolve(false);
  pic18.loading=true;
  pic18.pending=httpGetRaw(PIC18_API,20000).then(function(body){
    pic18.loading=false;
    if(isErr(body)){pic18.err=body;pic18Render();return false;}
    var arr=[];
    try{var d=JSON.parse(String(body).trim());arr=(d&&d.data)||[];}catch(e){}
    var best=null;
    for(var i=0;i<arr.length;i++){
      var o=arr[i];
      if(!o||!o.url)continue;
      if(String(o.alias||'')!==PIC18_ALIAS)continue;
      if(!best||(parseInt(o.issue,10)||0)>(parseInt(best.issue,10)||0))best=o;
    }
    if(best){
      pic18.issue=String(best.issue||'');
      pic18.url=pic18Abs(best.url);
      pic18.ts=Date.now();pic18.err='';pic18Save();
    }else{
      pic18.err='接口暂无 18 码中特图';
    }
    pic18Render();
    return !!best;
  }).catch(function(e){
    pic18.loading=false;pic18.pending=null;pic18.err=(e&&e.message)||'加载失败';pic18Render();return false;
  });
  return pic18.pending;
}

var syncState={busy:false,lastOk:0};
var lastIssue='',lastPredIssue='';
var statusText='准备中…';
var pollTimer=null;
function tryBeginSync(force){
  if(syncState.busy)return false;
  if(!force&&Date.now()-syncState.lastOk<SYNC_MIN_INTERVAL_MS)return false;
  syncState.busy=true;return true;
}
function setStatus(s){
  statusText=s;
  var el=document.getElementById('status');
  if(el)el.textContent=s;
}
function syncNow(hint,force){
  if(!tryBeginSync(force)){
    if(store.draws.length)lastIssue=store.draws[0].issue;
    setStatus('30 秒内已同步 · 最新第'+(store.draws.length?store.draws[0].issue:'-')+'期');
    return Promise.resolve(false);
  }
  setStatus(hint);
  var chain=Promise.resolve();
  /* 历史不足 150 期 → 正常翻年补齐；
     已有内嵌快照（data 可能是几天前的） → 强制拉整年，把快照到今天的缺口填平 */
  chain=chain.then(function(){
    if(store.draws.length<MAX_KEEP)return store.fetchHistory();
    if(store.usingBoot())return store.fetchHistory(true);
  });
  return chain.then(function(){return store.fetchLatest();}).then(function(err){
    return store.fetchPrediction().then(function(){return err;});
  }).then(function(err){
    syncState.busy=false;
    if(err==null&&store.draws.length){
      syncState.lastOk=Date.now();
      var cur=store.draws[0].issue;
      var changed=(cur!==lastIssue);
      lastIssue=cur;
      if(store.prediction&&store.prediction.issue!==lastPredIssue){
        changed=true;lastPredIssue=store.prediction.issue;
      }
      var predInfo=store.prediction?' · 在线预测第'+store.prediction.issue+'期':'';
      var lsInfo=LS.ok?'':' · ⚠本次不保存（存储受限）';
      setStatus('✓ 已自动同步 · 最新第'+cur+'期 · 共'+store.draws.length+'期'+predInfo+lsInfo+' · '+Math.round(POLL_MS/1000)+'秒后自动再查');
      if(changed){render();loadPic18Soon(false);return true;}
    }else{
      /* 离线（file:// 打开 / 无网）且有内嵌数据 → 给出明确可用的状态，不留失败红字 */
      if(store.draws.length){
        setStatus('离线模式 · 使用内置 '+store.draws.length+' 期数据 · 最新第'+store.draws[0].issue+'期 · 联网后自动更新');
      }else{
        setStatus('✗ 同步失败：'+(err||'未知错误')+' · 将自动重试');
      }
    }
    return false;
  }).catch(function(e){
    syncState.busy=false;
    setStatus('✗ 同步异常：'+(e&&e.message?e.message:e));
    return false;
  });
}
function startPoll(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(function(){
    if(document.hidden)return;   /* 后台不轮询，省电（iOS 切后台即冻） */
    syncNow('定时轮询：检查新开奖…',false);
  },POLL_MS);
}

/* Canvas 柱状图：复刻 ZodiacBarChart.onDraw */
function drawChart(id,data){
  var cv=document.getElementById(id);
  if(!cv)return;
  var W=cv.clientWidth||300,H=180;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  var g=cv.getContext('2d');
  g.setTransform(DPR,0,0,DPR,0,0);
  g.clearRect(0,0,W,H);
  var padL=26,padB=26,padT=12,padR=8;
  var plotW=W-padL-padR,plotH=H-padT-padB;
  var max=1;
  for(var i=0;i<ZODIAC.length;i++){var v=data[ZODIAC[i]]||0;if(v>max)max=v;}
  g.strokeStyle='#2A2F3A';g.lineWidth=1;
  for(var k=0;k<=3;k++){
    var y=Math.round(padT+plotH-plotH*k/3)+0.5;
    g.beginPath();g.moveTo(padL,y);g.lineTo(W-padR,y);g.stroke();
  }
  var n=ZODIAC.length,slot=plotW/n;
  for(var j=0;j<n;j++){
    var z=ZODIAC[j],cnt=data[z]||0;
    var bh=Math.round(cnt/max*plotH);
    var x=padL+j*slot+slot*0.2,bw=slot*0.6;
    g.fillStyle=(cnt===max?C.bad:(cnt===0?C.sub:C.acc));
    g.fillRect(x,padT+plotH-bh,bw,bh);
    g.fillStyle=C.txt;g.font='9px -apple-system,sans-serif';g.textAlign='center';
    g.fillText(String(cnt),x+bw/2,padT+plotH-bh-3);
    g.fillStyle=C.sub;g.font='10px -apple-system,sans-serif';
    g.fillText(z,x+bw/2,H-8);
  }
}

function trendReadCache(t,c){

    if(!s)return null;
    var parts=s.split('\n');
    if(parts.length!==4)return null;
    for(var i=0;i<parts.length;i++)if(!parts[i]||parts[i].slice(0,4)==='HTTP')return null;
    return parts;
  }catch(e){return null;}

function sameData(a,b){
  if(a==null||b==null)return false;
  if(String(a).trim()===String(b).trim())return true;
  try{
    var da=JSON.parse(String(a).trim()).data,db=JSON.parse(String(b).trim()).data;
    if(!da||!db)return false;
    var ka=Object.keys(da);if(ka.length!==Object.keys(db).length)return false;
    for(var i=0;i<ka.length;i++){
      var k=ka[i];
      if(!(k in db))return false;
      if(parseInt(da[k],10)!==parseInt(db[k],10))return false;
    }
    return true;
  }catch(e){return false;}
}

    if(!data){box.innerHTML='<div class="ln" style="color:'+C.bad+'">无尾数数据</div>';return;}
    var tails=[],maxCount=1;
    for(var i=0;i<10;i++){var c=parseInt(data[String(i)],10)||0;tails.push(c);if(c>maxCount)maxCount=c;}
    var html='<div style="display:flex">';
    for(var j=0;j<10;j++){
      html+='<div style="flex:1 1 0;text-align:center">'+
        '<div style="margin:0 auto;width:28px;height:28px;line-height:28px;border-radius:6px;background:'+C.card2+';font-weight:700;font-size:15px;color:'+(tails[j]>=maxCount*0.7?C.gold:C.txt)+'">'+j+'</div>'+
        '<div style="color:'+C.sub+';font-size:9px">'+tails[j]+'次</div></div>';
    }
    box.innerHTML=html+'</div>';
  }catch(e){box.innerHTML='<div class="ln" style="color:'+C.bad+'">解析异常: '+esc(e.message)+'</div>';}
}
function trendLocal(type,count){
  /* 离线降级：直接用本地已存的澳门 150 期自己算。
     实测该走势接口的 type 是「彩种」而非「正码/特码」：
       type=2 与澳门最新期前 6 个号（平码/正码）逐位吻合；
       type=1 是香港数据，本地没有。
     所以离线统一按「澳门前 6 个号」统计，返回结构与服务器一致，渲染函数零改动。 */
  var lim=Math.min(count,store.draws.length);
  var code={},zod={},tail={},wave={red:0,green:0,blue:0};
  for(var n=1;n<=49;n++)code[pad(n)]=0;
  for(var i=0;i<ZODIAC.length;i++)zod[ZODIAC[i]]=0;
  for(var t=0;t<10;t++)tail[String(t)]=0;
  for(var d=0;d<lim;d++){
    var dr=store.draws[d];
    for(var k=0;k<6;k++){
      var num=dr.nums[k];
      if(num<1||num>49)continue;
      code[pad(num)]++;
      tail[String(num%10)]++;
      var w=String((String(dr.wave||'').split(','))[k]||'').toLowerCase();
      if(w.indexOf('r')===0||w.indexOf('red')>=0)wave.red++;
      else if(w.indexOf('b')===0||w.indexOf('blue')>=0)wave.blue++;
      else if(w.indexOf('g')===0||w.indexOf('green')>=0)wave.green++;
      var zz=dr.zodiac[k];
      if(zz&&zod[zz]!=null)zod[zz]++;
    }
  }
  function wrap(o){return JSON.stringify({message:'success',code:200,local:true,data:o});}
  return [wrap(code),wrap(zod),wrap(wave),wrap(tail)];
}
function trendLoad(){
  if(trend.loading)return;
  trend.loading=true;
  var label=(trend.type===1?'正码':'特码')+'统计 · 最近'+trend.count+'期';
  var cached=trendReadCache(trend.type,trend.count);
  if(cached){
    trendRenderCode(cached[0]);trendRenderZodiac(cached[1]);
    trendRenderWave(cached[2]);trendRenderTail(cached[3]);
    setStatus('已显示缓存 · 正在检查更新…');
  }else{
    var b=document.getElementById('tCode');
    if(b)b.innerHTML='<div class="ln" style="color:'+C.sub+'">加载中… '+label+'</div>';
    ['tZodiac','tWave','tTail'].forEach(function(id){var e=document.getElementById(id);if(e)e.innerHTML='';});
    setStatus('加载中… '+label);
  }
  var body=JSON.stringify({type:trend.type,count:trend.count});
  var url=function(p){return TREND_BASE+p+'?time='+Date.now();};
  Promise.all([
    httpPostJson(url('/countCode'),body),
    httpPostJson(url('/countZodiac'),body),
    httpPostJson(url('/countWave'),body),
    httpPostJson(url('/countTail'),body)
  ]).then(function(r){
    trend.loading=false;
    var ok=!isErr(r[0])&&!isErr(r[1])&&!isErr(r[2])&&!isErr(r[3]);
    if(!ok){
      if(cached){setStatus('网络不可用 · 显示缓存 · '+label);return;}
      /* 完全离线（file:// 打开且无网）：用本地 150 期自己算，页面不留白 */
      var lc=trendLocal(trend.type,trend.count);
      trendRenderCode(lc[0]);trendRenderZodiac(lc[1]);trendRenderWave(lc[2]);trendRenderTail(lc[3]);
      setStatus('离线模式 · 本地统计 '+label+' · 联网后自动校准');
      return;
    }
    var changed=!cached||!sameData(cached[0],r[0])||!sameData(cached[1],r[1])
      ||!sameData(cached[2],r[2])||!sameData(cached[3],r[3]);
    if(changed){
      trendRenderCode(r[0]);trendRenderZodiac(r[1]);trendRenderWave(r[2]);trendRenderTail(r[3]);
      LS.set(trendCacheKey(trend.type,trend.count),
        String(r[0]).replace(/\n/g,'')+'\n'+String(r[1]).replace(/\n/g,'')+'\n'+
        String(r[2]).replace(/\n/g,'')+'\n'+String(r[3]).replace(/\n/g,''));
      setStatus('已更新 · '+label+' · '+nowStr());
    }else{
      setStatus('数据无变化 · '+label+' · 检查于'+nowStr());
    }
  });
}

function hotChip(detail,tabIdx){

function hotBarColor(detail,tabIdx){

function hotRenderRank(pd){

function hotLoadIssues(){
  if(hot.loading)return;

    hot.loading=false;
    if(isErr(body)){hotIssuesLocal();return;}
    try{

function hotLoadRank(page){
  if(hot.loading)return;
  if(hot.pageIndex<0){hotLoadIssues();return;}
  hot.loading=true;
  var box=document.getElementById('hotRank');
  if(box)box.innerHTML='<div class="ln" style="color:'+C.sub+'">加载中…</div>';
  var api=SITE+'/api/bet-statistics?lottery_type=21&issue='+hot.issues[hot.pageIndex]
    +'&bet_type='+BET_TYPES[hot.tab]+'&page='+(page+1);
  httpGetRaw(api).then(function(body){
    hot.loading=false;
    if(isErr(body)){
      if(box)box.innerHTML='<div class="ln" style="color:'+C.bad+'">'+esc(body)+'</div>';
      setStatus('第'+(hot.pageIndex>=0?hot.issues[hot.pageIndex]:'—')+'期 加载失败');
      return;
    }
    try{
      var root=JSON.parse(String(body).trim()),data=root.data,meta=root.meta;
      if(!data){if(box)box.innerHTML='<div class="ln" style="color:'+C.bad+'">榜单数据为空</div>';return;}
      var pd={tab:hot.tab,page:page,details:[],counts:[],offset:page*15+1,
        lastPage:meta&&meta.last_page?parseInt(meta.last_page,10):1};
      for(var i=0;i<data.length;i++){
        pd.details.push(data[i].bet_details==null?'':String(data[i].bet_details));
        pd.counts.push(parseInt(data[i].count,10)||0);
      }
      hot.page=page;hot.offset=pd.offset;hot.lastPage=pd.lastPage;
      setStatus('第'+hot.issues[hot.pageIndex]+'期 · '+BET_NAMES[pd.tab]+' · 来源：六合论坛');
      hotRenderRank(pd);
      hotLoadPic();
    }catch(e){
      if(box)box.innerHTML='<div class="ln" style="color:'+C.bad+'">解析失败：'+esc(e.message)+'</div>';
    }
  });
}

/* ============================================================
   PWA 增强：manifest + apple-touch-icon（单文件自注入，无需外部资源）
   ============================================================ */
(function(){
  try{
    /* ① apple-touch-icon：canvas 生成「深色底 + 白边号码球」图标 */
    var size=180,cv=document.createElement('canvas');
    cv.width=cv.height=size;
    var g=cv.getContext('2d');
    g.fillStyle='#0F1115';g.fillRect(0,0,size,size);
    var cx=size/2,cy=size/2+4,r=62;
    g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.fillStyle='#D9363E';g.fill();
    g.lineWidth=6;g.strokeStyle='#FFD700';g.stroke();
    g.fillStyle='#FFFFFF';g.font='bold 62px -apple-system,sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText('8',cx,cy+2);
    var icon=cv.toDataURL('image/png');
    var l=document.createElement('link');
    l.rel='apple-touch-icon';l.href=icon;
    document.head.appendChild(l);

    /* ② manifest：Blob 内联，支持 iOS「添加到主屏幕」全屏(standalone)运行 */
    var mani={
      name:'新澳门 · 六合分析',
      short_name:'新澳门',
      start_url:'.',
      display:'standalone',
      orientation:'portrait',
      background_color:'#0F1115',
      theme_color:'#0F1115',
      icons:[{src:icon,sizes:'180x180',type:'image/png'}]
    };
    var m=document.createElement('link');
    m.rel='manifest';
    m.href=URL.createObjectURL(new Blob([JSON.stringify(mani)],{type:'application/manifest+json'}));
    document.head.appendChild(m);
  }catch(e){}
})();
